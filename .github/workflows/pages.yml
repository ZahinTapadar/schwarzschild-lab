name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the geodesic engine to WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown --manifest-path engine/Cargo.toml
          cp engine/target/wasm32-unknown-unknown/release/geodesic.wasm web/engine.wasm

      - name: Build Schwarzschild Observatory to WebAssembly (served at /observatory/)
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path observatory/Cargo.toml -p observatory-wasm
          mkdir -p web/observatory/presets web/observatory/volumes
          cp observatory/web/index.html observatory/web/app.js observatory/web/worker.js web/observatory/
          cp observatory/target/wasm32-unknown-unknown/release/observatory_wasm.wasm web/observatory/observatory.wasm
          cp observatory/presets/*.json web/observatory/presets/
          cp observatory/volumes/*.obsvol web/observatory/volumes/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
